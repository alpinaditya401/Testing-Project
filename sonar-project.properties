# Konfigurasi SonarQube Cloud untuk repo publik AquaSmart.
#
# projectKey dan organization harus sama persis dengan yang dibuat SonarQube
# Cloud saat repositori diimpor. Kalau tidak sama, pemindaian gagal dengan
# "project not found", bukan gagal karena kualitas kode. Periksa nilainya di
# halaman proyek SonarQube Cloud sebelum menjalankan pipeline pertama kali.
sonar.projectKey=alpinaditya401_Project_Based_Learning
sonar.organization=alpinaditya401
sonar.projectName=AquaSmart AIoT
sonar.projectVersion=1.0

# Hanya jalur yang benar-benar ada di repo publik ini yang boleh disebut.
# sonar.sources yang menunjuk direktori tidak ada membuat pemindaian gagal,
# bukan sekadar memberi peringatan.
sonar.sources=frontend
sonar.tests=frontend/lib/api/schemas.test.ts,frontend/lib/form.test.ts
sonar.sourceEncoding=UTF-8

# Backend PHP dibekukan dan sudah punya gerbang verifikasinya sendiri
# (server/tests/run_verified_suite.py). Tidak dipindai di sini supaya hasil
# Quality Gate mencerminkan kode front-end yang memang dinilai.
#
# Berkas test sudah masuk lewat sonar.tests. Tanpa pengecualian ini berkas yang sama
# juga terindeks sebagai sumber, dan pemindai gagal dengan "can't be indexed twice".
sonar.exclusions=\
  **/*.test.ts,\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/coverage/**,\
  **/*.min.js,\
  frontend/lib/api/fixtures.json

# Cakupan test front-end BELUM diukur.
#
# "npm test" pada frontend menjalankan node --test tanpa penghitung cakupan,
# sehingga frontend/coverage/lcov.info tidak pernah dibuat. Baris
# sonar.javascript.lcov.reportPaths sengaja tidak diaktifkan: menunjuk berkas
# yang tidak ada hanya menghasilkan laporan cakupan nol persen, dan angka itu
# akan terbaca seolah kode ini tanpa test. Kenyataannya ada 84 test kontrak
# skema yang lulus, tetapi cakupannya memang belum pernah dihitung.
#
# Untuk mengaktifkannya nanti, tambahkan skrip berikut pada frontend/package.json:
#   "test:coverage": "node --test --experimental-test-coverage
#     --test-reporter=lcov --test-reporter-destination=coverage/lcov.info
#     lib/api/schemas.test.ts lib/form.test.ts"
# lalu hapus tanda pagar pada baris di bawah.
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Kalau proyek Modul 8 (02_Praktikum-Frontend/modul-8) ikut diterbitkan ke repo
# ini, ganti dua baris sumber di atas menjadi baris berikut. Proyek itu sudah
# punya laporan cakupan sendiri dari "npm run test:coverage".
# sonar.sources=frontend,02_Praktikum-Frontend/modul-8/src
# sonar.tests=frontend/lib/api/schemas.test.ts,02_Praktikum-Frontend/modul-8/src/lib/evaluate.test.ts
# sonar.javascript.lcov.reportPaths=02_Praktikum-Frontend/modul-8/coverage/lcov.info
