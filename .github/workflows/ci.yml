name: CI

# Gerbang verifikasi sebelum rilis: lint, pemeriksaan tipe, test, dan build.
# Pemindaian SonarQube Cloud berjalan pada job terpisah dan hanya aktif kalau
# secret SONAR_TOKEN sudah dipasang, supaya fork dan checkout sebelum token ada
# tidak gagal karena hal yang bukan kesalahan kode.

on:
  push:
    branches: [main, publish]
  pull_request:
    branches: [main, publish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (Biome)
        run: npx biome check .

      - name: Pemeriksaan tipe
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        # Build sengaja gagal tanpa variabel ini. Nilainya adalah backend PHP
        # produksi; tidak ada rahasia di dalamnya, jadi boleh ditulis langsung.
        env:
          AQUASMART_API_URL: https://projectbasedlearning-production.up.railway.app
        run: npm run build

  backend:
    name: Backend PHP dan SPA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01_AquaSmart/01_Aplikasi-Web
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Suite browser memakai WebSocket bawaan Node (Node 22 ke atas).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test backend dan lint PHP
        run: python server/tests/run_verified_suite.py

      - name: Suite browser SPA
        # Runner Ubuntu juga memasang Microsoft Edge; Chrome dipilih eksplisit
        # supaya suite memakai browser yang sama di setiap jalannya.
        env:
          AQUASMART_BROWSER: /usr/bin/google-chrome
        run: python web/tests/verify_frontend_fixes.py

  layanan-ai:
    name: Backend Flask (Layanan AI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01_AquaSmart/Backend-Flask
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 01_AquaSmart/Backend-Flask/requirements*.txt

      - run: pip install -r requirements-dev.txt

      # Termasuk uji paritas: model layanan harus identik dengan evaluasi_mandiri.json.
      - name: Test
        run: python -m pytest -q

      # Image yang sama dengan deploy Railway: bootstrap harus melatih dan mengaktifkan
      # model, gunicorn berjalan tanpa root, dan /api/predict menjawab dengan model itu.
      - name: Build dan jalankan image Docker
        run: |
          docker build -t aquasmart-ai .
          docker run -d --name ai -p 8000:8000 -e AQUASMART_AI_BOOTSTRAP=1 \
            -e AQUASMART_AI_SERVICE_KEY=ci-service-key-0123456789 \
            -e AQUASMART_AI_ADMIN_KEY=ci-admin-key-0123456789 aquasmart-ai
          for i in $(seq 1 90); do curl -fs localhost:8000/api/health > /dev/null && break; sleep 2; done
          docker logs ai
          curl -fs localhost:8000/api/health | python -c "import json,sys; d=json.load(sys.stdin); print(d); assert d['active_model']"
          python - <<'PY'
          import datetime, json, urllib.request
          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0)
          rows = [{'time': (now - datetime.timedelta(minutes=5 * (23 - i))).strftime('%Y-%m-%dT%H:%M:%SZ'),
                   'ph': 7.2, 'temperature': 27.5} for i in range(24)]
          req = urllib.request.Request('http://localhost:8000/api/predict', method='POST',
                                       data=json.dumps({'readings': rows}).encode(),
                                       headers={'Content-Type': 'application/json',
                                                'X-AquaSmart-AI-Key': 'ci-service-key-0123456789'})
          rec = json.load(urllib.request.urlopen(req))['recommendation']
          print(rec['condition'], rec['source'], rec['model'])
          assert rec['model'] and rec['actuation'] is False
          PY
          docker top ai -o user,args
          ! docker top ai -o user,args | grep gunicorn | grep -q '^root'

  mobile:
    name: Mobile Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01_AquaSmart/Mobile-Flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - run: flutter analyze

      - run: flutter test

      # Runner Ubuntu menyediakan Android SDK; APK debug diunggah sebagai artefak
      # supaya bisa dipasang di HP untuk pengujian.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build APK debug
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: aquasmart-mobile-debug-apk
          path: 01_AquaSmart/Mobile-Flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  sonarqube:
    name: SonarQube Quality Gate
    needs: [frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Lewati kalau token belum dipasang
        if: env.SONAR_TOKEN == ''
        run: |
          echo "Secret SONAR_TOKEN belum ada. Pemindaian dilewati."
          echo "Pasang di Settings > Secrets and variables > Actions, lalu jalankan ulang."

      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          # Sonar memakai riwayat untuk menentukan kode baru pada analisis PR.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: env.SONAR_TOKEN != ''
        with:
          node-version: 24

      - name: Pindai
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4

      - name: Tunggu hasil Quality Gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
